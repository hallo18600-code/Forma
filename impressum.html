<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root{color-scheme:light dark;--bg:#f3f4f6;--card:#fff;--tx:#111;--sub:#555;--line:#e5e7eb}

    body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

    .card{background:var(--card);border-radius:16px;padding:8px 20px 16px}

    .li{padding:12px 0;border-bottom:1px solid var(--line)} .li:last-of-type{border-bottom:0}
    .sub{color:var(--sub);font-size:15px;margin-top:2px}
    nav{margin-top:20px;font-size:15px} a{color:inherit}
  </style>
</head>
<body>
<main>
  <div class="card" id="text"></div>
  <nav><a href="datenschutz.html">Datenschutz</a> · <a href="./">Zur App</a></nav>
