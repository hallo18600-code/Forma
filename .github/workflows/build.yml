name: Build food data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb
      - run: python build_foods.py
      - run: |
          git config user.name "foods-bot"
          git config user.email "bot@users.noreply.github.com"
          git add foods.json
          git commit -m "Update foods.json" || echo "no changes"
          git push
