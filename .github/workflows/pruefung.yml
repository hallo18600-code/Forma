name: Sicherheitsprüfung
# Läuft bei jeder Änderung: rechnet Profile, Coach und alle Lebensmittel durch (tests/pruefung.py).
on:
  push:
  workflow_dispatch:
jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 &
          sleep 2
          python tests/pruefung.py
