<html lang="de">
<head>

<meta name="theme-color" content="#12a05a">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FORMA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

  <meta charset="UTF-8" />

  <title>FORMA</title>
  <style>
    :root {
      --bg:#f3f4f6; --card:#fff; --ink:#17181a; --muted:#8d939b; --line:#eef0f3;
      --accent:#1aa35a; --accent-soft:#e8f7ee; --warn:#e0a23a; --bad:#e15b3d;
      --ok:#1aa35a; --ok-bg:#e8f7ee;
      --shadow:0 1px 0 rgba(16,24,40,.03);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; height:100%; }
    body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; background:#8f97a1; color:var(--ink); }
    button, input { font:inherit; color:inherit; }
    button { background:none; border:0; padding:0; cursor:pointer; }
    .stage { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px 12px; }
    .phone { width:390px; height:844px; background:#0c0d0e; border-radius:46px; padding:10px; box-shadow:0 30px 80px rgba(0,0,0,.35); }
    .wrap { height:100%; background:var(--bg); border-radius:36px; overflow:hidden; position:relative; display:flex; flex-direction:column; }
    .notch { position:absolute; top:8px; left:50%; transform:translateX(-50%); width:124px; height:28px; background:#0c0d0e; border-radius:20px; z-index:30; }
    #app { flex:1; min-height:0; display:flex; flex-direction:column; }
    @media (max-width:480px) {
      body { background:var(--bg); }
      .stage { padding:0; }
      .phone, .wrap { width:100vw; height:100dvh; border-radius:0; padding:0; box-shadow:none; }
      .notch { display:none; }
    }
    .screen { flex:1; min-height:0; display:flex; flex-direction:column; }
    .scroll { flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch; padding:56px 16px 18px; }
    .pad { padding-bottom:96px; }
    .topbar { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:14px; gap:8px; }
    h1 { font-size:28px; margin:0; letter-spacing:-.04em; font-weight:800; }
    h2 { font-size:16px; margin:0; font-weight:700; }
    .sub { color:var(--muted); font-size:13px; }
    .row { display:flex; align-items:center; gap:8px; }
    .space { justify-content:space-between; }
    .grow { flex:1; min-width:0; }
    .card { background:var(--card); border-radius:22px; padding:16px; box-shadow:var(--shadow); }
    .gap { height:12px; }
    .section { display:flex; align-items:center; justify-content:space-between; margin:18px 2px 10px; } .section h2 { font-size:22px; letter-spacing:-.03em; }
    .link { color:var(--accent); font-size:13px; font-weight:700; }
    .pill { height:48px; border-radius:999px; padding:0 14px; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:700; font-size:15px; }
    .pill.primary { background:var(--accent); color:#fff; width:100%; }
    .pill.dark { background:#17181a; color:#fff; width:100%; }
    .pill.ghost { background:#eef0f3; color:var(--ink); }
    .pill:disabled { opacity:.45; }
    .pill:active { transform:scale(.98); }
    .plus { width:36px; height:36px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-size:22px; flex:none; }
    .plus.dark { width:42px; height:42px; border-radius:50%; background:#1c1d1f; color:#fff; font-size:26px; }
    .tabs { position:absolute; left:12px; right:12px; bottom:10px; background:#fff; border-radius:22px; box-shadow:0 8px 24px rgba(16,24,40,.08); display:grid; grid-template-columns:repeat(5,1fr); padding:8px 0 10px; z-index:8; }
    .tab { display:flex; flex-direction:column; align-items:center; gap:2px; color:#9aa0a6; font-size:9px; font-weight:650; }
    .tab.on { color:var(--accent); }
    .tab svg { width:21px; height:21px; }
    .sum { display:grid; grid-template-columns:1fr 118px 1fr; align-items:center; }
    .sum .side, .sum .num { text-align:center; }
    .sum .num { font-size:18px; font-weight:800; }
    .sum .lbl { font-size:11px; color:var(--muted); }
    .ring { width:118px; height:118px; position:relative; margin:0 auto; }
    .ring svg { width:118px; height:118px; transform:rotate(-90deg); }
    .ring .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .ring .mid b { font-size:26px; letter-spacing:-.04em; }
    .ring .mid span { font-size:11px; color:var(--muted); }
    .macros { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:14px; }
    .mac .bar, .bar { height:6px; background:#eef0f3; border-radius:99px; overflow:hidden; margin-top:6px; }
    .mac .bar i, .bar i { display:block; height:100%; border-radius:99px; background:var(--accent); }
    .mac b { font-size:13px; }
    .mac span { font-size:11px; color:var(--muted); }

    .meals { padding:6px 14px; }
    .meal-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #f0f1f4; width:100%; text-align:left; }
    .meal-row:last-child { border-bottom:0; }
    .bubble { width:46px; height:46px; border-radius:50%; border:1.5px solid #eceff3; display:grid; place-items:center; font-size:22px; background:#fff; flex:none; }
    .meal-name { font-size:16px; font-weight:750; }
    .mac { text-align:center; }
    .mac .dotbar { height:5px; background:#eceff3; border-radius:99px; position:relative; margin:8px 0 6px; }
    .mac .dotbar i { display:block; height:100%; border-radius:99px; background:#d7dde3; }
    .mac .dotbar b { position:absolute; left:0; top:50%; width:8px; height:8px; border-radius:50%; background:var(--accent); transform:translate(-2px,-50%); }
    .meal-card { margin-bottom:10px; }
    .meal-head { display:flex; align-items:center; gap:12px; }
    .micon { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none; position:relative; }
    .micon svg { width:22px; height:22px; }
    .micon .mini { position:absolute; inset:-3px; }
    .food { display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 0 0; }
    .thumb { width:42px; height:42px; border-radius:50%; background:#f3f4f6; display:grid; place-items:center; font-size:20px; flex:none; }
    .score { min-width:36px; height:36px; border-radius:10px; color:#fff; display:grid; place-items:center; font-weight:800; font-size:13px; }
    .s-good { background:var(--accent); } .s-mid { background:var(--warn); } .s-bad { background:var(--bad); }
    .x { width:28px; height:28px; border-radius:8px; color:#9aa0a6; font-size:16px; }
    .drops { display:flex; gap:6px; flex-wrap:wrap; }
    .drop { width:28px; height:28px; border-radius:50%; background:#eef0f3; display:grid; place-items:center; font-size:12px; }
    .drop.on { background:var(--accent-soft); }
    .sheet { position:absolute; inset:0; background:rgba(10,12,14,.45); display:flex; align-items:flex-end; z-index:20; }
    .sheet-card { width:100%; background:#fff; border-radius:22px 22px 0 0; padding:10px 16px 28px; max-height:92%; overflow:auto; }
    .grab { width:36px; height:4px; background:#d9dde2; border-radius:4px; margin:6px auto 12px; }
    .choice { width:100%; text-align:left; padding:14px; border-radius:14px; background:#f6f7f8; margin-bottom:8px; }
    .choice.on { background:var(--accent-soft); outline:2px solid var(--accent); }
    .chip { display:inline-flex; align-items:center; padding:8px 12px; border-radius:999px; background:#f3f4f6; font-size:13px; font-weight:650; }
    .chip.on { background:var(--accent); color:#fff; }
    .field label { display:block; font-size:12px; color:var(--muted); margin:10px 0 6px; font-weight:600; }
    .field input { width:100%; height:46px; border:1px solid var(--line); border-radius:12px; padding:0 12px; background:#fff; }
    .scanbox { height:140px; border-radius:16px; background:#17181a; color:#fff; display:grid; place-items:center; }
    .welcome { background:#fff; padding:96px 24px 28px; height:100%; display:flex; flex-direction:column; }
    .logo { font-weight:900; letter-spacing:-.05em; font-size:22px; color:var(--accent); }
    .welcome h1 { font-size:34px; line-height:1.08; margin:26px 0 10px; }
    .toast { position:absolute; left:20px; right:20px; bottom:96px; z-index:25; background:#111; color:#fff; border-radius:12px; padding:12px; text-align:center; font-size:13px; }
    .wo-head { display:flex; align-items:center; justify-content:space-between; padding-bottom:10px; }
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; text-align:center; padding:8px 0 12px; }
    .stats b { display:block; color:var(--accent); font-size:15px; }
    .stats span { font-size:11px; color:var(--muted); }
    table.sets { width:100%; border-collapse:collapse; font-size:13px; }
    table.sets th { color:var(--muted); font-weight:600; font-size:11px; text-align:left; padding:6px 4px; }
    table.sets td { padding:6px 4px; }
    table.sets input { width:54px; height:34px; border:0; background:#f3f4f6; border-radius:8px; text-align:center; font-weight:700; }
    tr.done td { background:var(--ok-bg); }
    .chk { width:28px; height:28px; border-radius:8px; background:#eef0f3; display:grid; place-items:center; font-weight:800; flex:none; }
    .chk.on, tr.done .chk { background:var(--ok); color:#fff; }
    .ex-name { color:var(--accent); font-weight:800; font-size:16px; }
    .weekdays { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center; }
    .daydot { height:48px; width:44px; border-radius:50%; background:#fff; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .daydot b { font-size:14px; }
    .daydot span { font-size:10px; color:var(--muted); }
    .daydot.on { background:var(--accent); color:#fff; }
    .daydot.on span { color:#e8fff1; }
    .dots { display:flex; gap:6px; margin-bottom:16px; }
    .dots i { width:7px; height:7px; border-radius:99px; background:#d5d8dc; }
    .dots i.on { width:16px; background:var(--accent); }
    .stepper { display:flex; align-items:center; justify-content:space-between; background:#f3f4f6; border-radius:12px; padding:6px 8px; }
    .q { padding:10px 0; border-bottom:1px solid var(--line); }
    .opts { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    svg.spark { width:100%; height:64px; }
    .bigw { font-size:44px; font-weight:800; letter-spacing:-.05em; line-height:1; }
    .kpi { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
    .kpi div { background:#f6f7f8; border-radius:12px; padding:10px 8px; text-align:center; }
    .kpi b { display:block; font-size:14px; }
    .kpi span { font-size:10px; color:var(--muted); }
    .group { background:#fff; border-radius:22px; overflow:hidden; box-shadow:var(--shadow); }
    .g-row { width:100%; text-align:left; padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
    .g-row:last-child { border-bottom:0; }
    .avatar { width:52px; height:52px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:800; font-size:22px; }
    .tog { width:46px; height:28px; border-radius:99px; background:#e3e6ea; position:relative; flex:none; }
    .tog.on { background:var(--accent); }
    .tog i { position:absolute; top:3px; left:3px; width:22px; height:22px; background:#fff; border-radius:50%; }
    .tog.on i { left:21px; }
    .task { width:100%; text-align:left; display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
    .task:last-child { border-bottom:0; padding-bottom:0; }
    .task:first-child { padding-top:0; }
    .weekline { display:flex; gap:5px; margin-top:6px; }
    .weekline i { width:18px; height:6px; border-radius:4px; background:#e8eaee; }
    .weekline i.on { background:var(--accent); }
    .weekline i.today { outline:1px solid #1114; outline-offset:1px; }
    .navd { width:36px; height:36px; border-radius:50%; background:#fff; box-shadow:var(--shadow); font-size:18px; }

    .seg { display:flex; background:#eef0f3; border-radius:12px; padding:3px; gap:2px; }
    .seg button { flex:1; height:32px; border-radius:10px; font-size:12px; font-weight:700; color:#6b7178; }
    .seg button.on { background:#fff; color:var(--ink); box-shadow:var(--shadow); }
    .wgrid { display:grid; grid-template-columns:72px 1fr 72px; align-items:center; gap:6px; }
    .wside { text-align:center; }
    .wside b { display:block; font-size:16px; }
    .wring { width:168px; height:168px; margin:0 auto; position:relative; }
    .wring svg { width:168px; height:168px; }
    .wring .mid { position:absolute; inset:28px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .wring .mid b { font-size:32px; letter-spacing:-.04em; }
    .plan-step { width:100%; text-align:left; display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
    .ico { width:46px; height:46px; border-radius:50%; border:1.5px solid #eceff3; background:#fff; color:var(--ink); display:grid; place-items:center; flex:none; font-size:20px; }
    .ico svg { width:18px; height:18px; }


    .calhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .calgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px 2px; text-align:center; }
    .calcell { min-height:54px; }
    .cdot { width:34px; height:34px; border-radius:50%; margin:0 auto; display:grid; place-items:center; font-weight:750; }
    .cdot.on { background:var(--accent); color:#fff; }
    .cdot.today { outline:2px solid var(--accent); }
    .cname { font-size:9px; color:var(--muted); margin-top:2px; line-height:1.1; }
    .yeargrid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px 10px; }
    .mini { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .sq { width:100%; aspect-ratio:1; border-radius:2px; background:#eceff3; }
    .sq.on { background:var(--accent); }
    .sq.empty { background:transparent; }
    .heat { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,8px); gap:2px; }
    .heat i { width:8px; height:8px; border-radius:2px; background:#eceff3; }
    .heat i.on { background:var(--accent); }

    .wbars { display:flex; align-items:flex-end; gap:8px; height:92px; }
    .wbar { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
    .wbar i { width:100%; max-width:18px; border-radius:9px; background:#e6f6ec; min-height:6px; }
    .wbar.on i { background:var(--accent); }
    .wbar span { font-size:10px; color:var(--muted); }
    .dash { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .dash button { background:#fff; border-radius:22px; min-height:76px; padding:14px; display:flex; align-items:center; gap:10px; font-weight:750; text-align:left; box-shadow:var(--shadow); }
    .dash svg { width:22px; height:22px; flex:none; }
    .clock { font-variant-numeric:tabular-nums; font-size:28px; font-weight:800; letter-spacing:-.04em; }
    .rest { margin:8px 0; background:#111; color:#fff; border-radius:12px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; }

    :root{--accent:#12a05a;--shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05)}
    body{background:radial-gradient(900px 500px at 15% -5%,#c3e3d1,transparent),#8f97a1}
    .phone{box-shadow:0 40px 90px rgba(10,20,30,.4),inset 0 0 0 2px #25272a}
    .card{border-radius:24px}
    .pill.primary{background:linear-gradient(135deg,#1db36a,#0f8f50);box-shadow:0 6px 16px rgba(18,160,90,.28)}
    .pill.dark{background:linear-gradient(135deg,#25272b,#0c0d0e)}
    .pill,.chip,.tab,.food,.choice,.card{transition:transform .12s,background .2s,color .2s}
    .chip.on{box-shadow:0 4px 10px rgba(18,160,90,.25)}
    .tabs{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7)}
    .tab{font-size:10px}.tab.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:1px}
    .score{border-radius:12px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
    .s-good{background:linear-gradient(135deg,#27c077,#12a05a)}.s-mid{background:linear-gradient(135deg,#efb54e,#dc9b2a)}.s-bad{background:linear-gradient(135deg,#ee7656,#d9482a)}
    .welcome{background:linear-gradient(180deg,#e6f7ee,#fff 55%)}
    .welcome h1{font-size:38px;letter-spacing:-.04em}
    .why{margin:4px 0 12px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .why div{display:flex;justify-content:space-between;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line)}
    .why div:last-child{border:0}.why b.up{color:var(--ok)}.why b.dn{color:var(--bad)}
    .insight{display:flex;flex-direction:column;gap:3px;margin-top:12px;padding:14px 16px;border-radius:20px;background:var(--accent-soft);color:#14683e;font-size:13px}
    .warn{margin-top:12px;padding:12px 14px;border-radius:16px;background:#fff4e0;color:#8a5a00;font-size:13px}

    .yhead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:14px}
    .yhead b{text-align:center;font-size:17px}
    .ycount,.yback{width:38px;height:38px;border-radius:50%;background:#f1f1ef;display:flex;align-items:center;justify-content:center;font-size:15px;color:#666;border:0}
    .yback{font-size:26px;line-height:1}
    .ytiles{display:flex;gap:12px;margin-bottom:14px}
    .ytile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#6b7076;background:none;border:0;padding:0}
    .ytile i{width:68px;height:68px;border-radius:18px;border:1.5px solid #e4e5e3;background:#fafaf9;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:28px}
    .ysearch input{width:100%;border:2px solid #5fa97c;border-radius:14px;padding:12px 14px 12px 40px;font-size:16px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' fill='none' stroke='%23555' stroke-width='2'><circle cx='8' cy='8' r='6'/><path d='M13 13l4 4'/></svg>") no-repeat 13px center}
    .yrow{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #eceeec}
    .ynm{text-align:left;background:none;border:0;padding:0;min-width:0}
    .ynm b{font-weight:600;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ykc{font-size:14px;color:#444;white-space:nowrap}
    .yplus{width:34px;height:34px;border-radius:50%;border:2px solid #5fa97c;color:#3f8f5f;background:none;font-size:22px;line-height:1;flex:none}
    .yfertig{position:sticky;bottom:0;width:100%;margin-top:14px;padding:17px;border-radius:18px;background:#111;color:#fff;font-weight:700;font-size:16px;border:0}
    .ycard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#f4f4f2;border:0;border-radius:20px;padding:16px;margin-bottom:12px}
    .ycard span{font-size:26px}.ycard b{font-size:16px}
    .bcbox{position:relative;height:230px;border-radius:20px;background:#111;overflow:hidden;margin-bottom:12px;display:flex;align-items:center;justify-content:center}
    .bcbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .bcframe{position:relative;width:70%;height:90px;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
    .bcmsg{position:absolute;bottom:10px;left:12px;right:12px;color:#fff;font-size:13px;text-align:center}
    .aitext{width:100%;min-height:96px;border:1.5px solid #e4e5e3;border-radius:16px;padding:12px;font:inherit;margin:10px 0;resize:vertical}

    .rchk{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
    .rbtn{flex:1;display:flex;align-items:center;gap:12px;padding:12px 0;background:none;border:0;text-align:left;font:inherit}
    .box{width:26px;height:26px;border-radius:8px;border:2px solid #cfd3d8;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
    .box.on{background:var(--accent);border-color:var(--accent)}
    .rgrid{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}

function weightView(){
  const all = state.weights.slice().sort((a,b)=>a.date<b.date?-1:1);

  const from = addDays(todayIso(), -days+1);

  const last = lastWeight();
  const start = all[0] ? all[0].kg : last;
  const startDate = all[0] ? all[0].date : todayIso();
  const goal = +state.profile.target;
  const span = Math.abs(goal-start) || 1;
  const moved = start<=goal ? Math.max(0, last-start) : Math.max(0, start-last);
  const pct = Math.max(0, Math.min(1, moved/span));
  const dir = goal>=start ? 1 : -1;
  const next = +(last + dir*0.5).toFixed(1);
  const avg = ws.length ? ws.reduce((n,w)=>n+w.kg,0)/ws.length : last;

  const weightAt = dd => { const c=all.filter(w=>w.date<=dd); return c.length? c[c.length-1].kg : null; };

  const picked = selW ? `<div class="row space" style="margin-top:4px"><b style="font-size:18px">${selW.kg.toFixed(1)} kg</b><span class="sub">${selW.date.split("-").reverse().join(".")}</span></div>` : `<div class="sub">Noch keine Einträge</div>`;
  const area = pts.length ? `M${pts[0][0]},${H-pad} L${line.replace(/ /g," L")} L${pts[pts.length-1][0]},${H-pad} Z` : "";
  const gy = H-pad - ((goal-min)/(max-min))*(H-2*pad);
  return `<div class="card">
    <div class="row space"><div class="bubble">⚖️</div><b>Gewicht</b><button class="link" data-act="open" data-type="entries">Einträge</button></div>
    <div class="wgrid" style="margin-top:8px">
      <div class="wside"><span class="sub">BMI</span><b>${bmi()}</b><span class="sub">${bmiLabel(bmi())}</span></div>
      <div class="wring">
        <svg viewBox="0 0 168 168">
          <circle cx="84" cy="84" r="70" fill="none" stroke="#eef1f4" stroke-width="12"/>
          <circle cx="84" cy="84" r="70" fill="none" stroke="#1aa35a" stroke-width="12" stroke-linecap="round" transform="rotate(-90 84 84)" stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
        </svg>
        <div class="mid"><span class="sub">Fortschritt ${Math.round(pct*100)} %</span><b>${Number(last).toFixed(1)}</b><span class="sub">kg · ${labelDate(all.length?all[all.length-1].date:todayIso())}</span></div>
      </div>
      <div class="wside"><span class="sub">Weiter</span><b>${next.toFixed(1)}</b><span class="sub">kg</span></div>
    </div>
    <div class="row space" style="margin-top:8px">
      <div><span class="sub">Start</span><b style="display:block">${start.toFixed(1)} kg</b><span class="sub">${startDate.split("-").reverse().join(".")}</span></div>
      <div style="text-align:right"><span class="sub">Ziel</span><b style="display:block">${goal.toFixed(1)} kg</b><button class="link" data-act="open" data-type="goaldate">${state.profile.goalDate?state.profile.goalDate.split("-").reverse().join("."):"Datum festlegen"}</button></div>
    </div>

  </div>
  <div class="gap"></div>
  <div class="card">
    <div class="row space"><h2>Gewichtsfortschritt</h2><span class="sub">${(last-start>=0?"+":"")+(last-start).toFixed(1)} kg</span></div>
    <div class="seg" style="margin:12px 0">
      ${[["7","Tage"],["30","Wochen"],["90","Monate"],["365","Jahre"]].map(([id,l])=>`<button class="${ui.wrange===id?"on":""}" data-act="wrange" data-v="${id}">${l}</button>`).join("")}
    </div>

    <svg class="spark" viewBox="0 0 ${W} ${H}" style="height:120px;margin-top:8px">
      <path d="${area}" fill="#1aa35a" opacity=".12"/>
      <line x1="8" y1="${gy}" x2="312" y2="${gy}" stroke="#1aa35a" stroke-dasharray="4 4" stroke-width="1"/>
      <polyline fill="none" stroke="#1aa35a" stroke-width="3" points="${line}"/>

    ${picked}
    <div class="wdeltas">${dirTxt(d30,"In 30 Tagen X")}${dirTxt(d90,"In 90 Tagen X")}</div>

  </div>`;
}

function exName(id){
  if(EX[id]) return EX[id].name;

}
function lastSet(id){
  const past = [...state.workouts].reverse();
  for(const w of past){
    const hit = (w.exercises||[]).find(e=>e.id===id);
    if(hit && hit.sets && hit.sets.length){
      const s = [...hit.sets].reverse().find(x=>x.done) || hit.sets[hit.sets.length-1];
      return s.kg+" kg × "+s.reps;
    }
  }
  return "–";
}
function clock(t0){
  const s=Math.max(0, Math.floor((Date.now()-t0)/1000));
  return [Math.floor(s/3600), Math.floor((s%3600)/60), s%60].map(n=>String(n).padStart(2,"0")).join(":");
}
function prevSet(id, index){
  for(const w of [...state.workouts].reverse()){
    const hit=(w.exercises||[]).find(e=>e.id===id);
    if(!hit) continue;
    const done=(hit.sets||[]).filter(s=>s.done);
    const s=done[index]||done[done.length-1];
    if(s) return s.kg+"×"+s.reps;
  }
  return "–";
}

function stepsCard(){

async function loadFoodDb(){

    FOODDB.rows=j.rows||[]; FOODDB.nm=FOODDB.rows.map(x=>NORM(x[1])); FOODDB.lc=FOODDB.rows.map(x=>NORM(x[1]+" "+(x[2]||"")));

function dbItem(x){ return {id:"db-"+x[0],type:"custom",src:"off",name:x[1],brand:x[2]||"",emoji:"📦",kcal:Math.round(x[3]),protein:x[4]||0,carbs:x[5]||0,fat:x[6]||0,sugar:x[7]??undefined,fiber:x[8]??undefined,salt:x[9]??undefined,sat:x[10]??undefined,processed:(x[11]||0)>=4,bc:x[0]}; }
function NORM(t){ return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss").replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u"); }
function qTokens(q){ return NORM(q).split(/\s+/).filter(Boolean).map(w=>w.length>=7?w.replace(/(en|n|e|s)$/,""):w); }
function hay(p){ return NORM(p.name+" "+(p.brand||"")+" "+((p.al||[]).join(" "))); }
function foodRank(p,q){
  const qn=NORM(q).trim(); if(!qn) return 5;
  const n=NORM(p.name), als=(p.al||[]).map(NORM);
  if(n===qn) return 0; if(als.includes(qn)) return 1; if(n.startsWith(qn)) return 2; if(als.some(a=>a.startsWith(qn))) return 3;
  if(n.split(" ").some(w=>w.startsWith(qn))) return 4; return 5;
}

function dbSearch(q,limit){
  const ts=qTokens(q); if(!ts.length) return [];
  const res=[];
  for(let i=0;i<FOODDB.lc.length;i++){
    const s=FOODDB.lc[i]; let sc=0, ok=true;
    for(const w of ts){ const p=s.indexOf(w); if(p<0){ ok=false; break; } sc+=p===0?3:(s[p-1]===" "?2:0); }
    if(!ok) continue;
    const n=FOODDB.nm[i]; if(n.startsWith(ts[0])) sc+=2;
    sc-=Math.min(n.length,60)/60;
    res.push([sc,i]);
  }
  res.sort((x,y)=>y[0]-x[0]||x[1]-y[1]);
  return res.slice(0,limit||30).map(r=>dbItem(FOODDB.rows[r[1]]));

async function bcLookup(code){

const U_P=["scheibe","scheiben","stück","stueck","stücke","stuecke","stk","riegel"];
const isG=u=>!!u&&Object.prototype.hasOwnProperty.call(U_G,u), isP=u=>!!u&&U_P.includes(u);
const PIECE={ei:60,eier:60,apfel:180,"äpfel":180,banane:120,bananen:120,birne:170,orange:150,"brötchen":60,broetchen:60,semmel:60,brezel:80,croissant:60,tomate:100,tomaten:100,avocado:150,kiwi:75,mandarine:80,kartoffel:90,kartoffeln:90,riegel:40,joghurt:150,skyr:150,"würstchen":50,wurst:50};
const SLICE={brot:40,toast:25,"käse":25,kaese:25,wurst:15,salami:15,schinken:15};
const DEF={butter:10,margarine:10,"öl":10,oel:10,"olivenöl":10,marmelade:20,honig:15,zucker:5,kaffee:200,tee:200,wasser:250,milch:200,saft:200,cola:330};
const NUMW={ein:1,eine:1,einen:1,einem:1,einer:1,zwei:2,drei:3,vier:4,"fünf":5,fuenf:5,sechs:6,halb:.5,halbe:.5,halben:.5,halbes:.5,anderthalb:1.5};
// Synonyme, die nicht schon als Alias in der Datenbank stehen (Schluessel = ganzer Name nach dem Normalisieren)
const SYN={"protein shake":"proteinpulver","eiweissshake":"proteinpulver","eiweiss shake":"proteinpulver","weissbrot":"toastbrot","vollkornbroetchen":"brötchen","kaffee schwarz":"kaffee","spaghetti":"nudeln gekocht","hahnchen":"hähnchenbrust","hahnchenfleisch":"hähnchenbrust","huhn":"hähnchenbrust"};
function matchFood(name){
  const syn=SYN[NORM(name).trim()]; if(syn) name=syn;
  const strict=["butter","ol","oel","salz"].includes(NORM(name).trim());
  const sing=w=>w.length>3?w.replace(/(er|en|n|e|s)$/,""):w;
  const variants=[name,name.split(/\s+/).map(sing).join(" ")];
  for(const q of variants){
    const ts=qTokens(q); if(!ts.length) continue;
    const pool=foods().filter(p=>!p.hidden&&!String(p.id).startsWith("db-")&&!String(p.id).startsWith("off-"));
    const qn=NORM(q).trim(), loc=rankSort(pool.filter(p=>{ const x=NORM(p.name+" "+(p.brand||"")); return (!strict&&ts.every(w=>x.includes(w)))||NORM(p.name)===qn||(p.al||[]).some(a=>NORM(a)===qn); }),q);
    if(loc[0]) return loc[0];
    if(FOODDB.ok){ const d=dbSearch(q,1); if(d[0]) return d[0]; }
  }
  return null;
}
function smartParse(text){
  const segs=text.toLowerCase().replace(/(\d),(\d)/g,"$1.$2").replace(/\b(ca\.?|etwa|ungefähr|circa|so)\b/g," ").split(/,|;|\n|\+|&|\bund\b|\bmit\b|\bsowie\b|\bdazu\b|\bplus\b/).map(x=>x.trim()).filter(Boolean);
  const items=[], miss=[];
  for(const seg of segs){
    const tk=seg.split(/\s+/); let i=0, qty=null, unit=null;
    const mm=tk[0].match(/^(\d+(?:[.,]\d+)?)([a-zäöüß]*)$/);
    if(mm){ qty=parseFloat(mm[1].replace(",",".")); if(mm[2]&&(isG(mm[2])||isP(mm[2]))) unit=mm[2]; i=1; }
    else if(NUMW[tk[0]]!==undefined){ qty=NUMW[tk[0]]; i=1; if(qty===1&&tk[1]&&String(tk[1]).startsWith("halb")){ qty=.5; i=2; } }
    if(unit==null&&tk[i]&&(isG(tk[i])||isP(tk[i]))&&tk.length>i+1){ unit=tk[i]; i++; }
    while(["von","vom","an","aus","der","die","das","dem"].includes(tk[i])) i++;
    let name=tk.slice(i).join(" ");
    if(!name&&unit&&isP(unit)){ name=unit; unit=null; }
    if(!name){ miss.push(seg); continue; }
    const f=matchFood(name);
    if(!f){ miss.push(name); continue; }
    // Gramm aus Stueck/Scheibe/Portion: erst Daten der Datenbank, dann alte Tabellen, dann Standard
    const words=name.split(/\s+/), pw=f.pieceG||words.map(w=>PIECE[w]).find(Boolean)||0, sw=f.sliceG||words.map(w=>SLICE[w]).find(Boolean)||0;
    let grams;
    if(unit&&/^scheibe/.test(unit)) grams=(qty||1)*(sw||30);
    else if(unit&&isP(unit)) grams=(qty||1)*(pw||100);
    else if(unit==="portion"||unit==="portionen") grams=(qty||1)*(pw>=50?pw:100);
    else if(unit==="teller"||unit==="schüssel"||unit==="schüsseln"||unit==="schuessel") grams=(qty||1)*(pw>=250?pw:((f.kcal||0)>300?80:U_G[unit]));
    else if(unit==="flasche"||unit==="flaschen"||unit==="dose"||unit==="dosen") grams=(qty||1)*(pw||U_G[unit]);
    else if(unit) grams=(qty||1)*U_G[unit];
    else if(qty!=null) grams=qty*(pw||sw||100);
    else grams=words.map(w=>DEF[w]).find(Boolean)||(pw>=50?pw:100);
    items.push({name:f.name,brand:f.brand||"",grams:Math.round(grams),kcal:f.kcal||0,protein:f.protein||0,carbs:f.carbs||0,fat:f.fat||0,sugar:f.sugar||0,processed:!!f.processed,ref:f.id});
  }
  return {items,miss};
}

async function aiRun(){
  const ta=document.getElementById("ai-text"); ui.aiText=(ta&&ta.value||"").trim();
  if(!ui.aiText){ toast("Beschreibe dein Essen"); return; }
  if(!window.claude){ const r=smartParse(ui.aiText); ui.aiRes=r.items.length?r.items:null; ui.aiMiss=r.miss; ui.aiErr=r.items.length?"":'Nichts erkannt. Schreib z. B. "200 g Haferflocken, 2 Eier, ein Apfel".'; render(); return; }
  ui.aiBusy=true; ui.aiErr=""; ui.aiRes=null; ui.aiMiss=[]; render();
  try{
    const sample=window.claude?await claude.use("sample"):null;
    if(!sample) throw new Error("Die KI-Erkennung braucht einen eigenen Server und ist in dieser Version noch aus.");
    const out=await sample.json('Du bist ein Ernährungs-Parser. Zerlege die Mahlzeitenbeschreibung in einzelne Lebensmittel und schätze realistische Gramm-Mengen (deutsche Standardportionen). Antworte NUR mit JSON: {"items":[{"name":"deutscher Name","grams":Zahl,"kcal":kcal pro 100 g,"protein":g pro 100 g,"carbs":g pro 100 g,"fat":g pro 100 g,"sugar":g pro 100 g,"processed":true oder false}]}. Beschreibung: '+JSON.stringify(ui.aiText));
    const items=((out&&out.items)||[]).filter(i=>i&&i.name&&+i.grams>0).slice(0,12).map(i=>({name:String(i.name).slice(0,60),grams:Math.round(+i.grams),kcal:+i.kcal||0,protein:+i.protein||0,carbs:+i.carbs||0,fat:+i.fat||0,sugar:+i.sugar||0,processed:!!i.processed}));
    if(!items.length) throw new Error("Nichts erkannt. Beschreibe es genauer.");
    ui.aiRes=items;
  }catch(e){ ui.aiErr=e&&e.code==="not_granted"?"Zugriff nicht erlaubt.":(e&&e.message)||"KI nicht erreichbar."; }
  ui.aiBusy=false; render();
}

function skinSheet(){
  const q=[
    {k:"typ", label:"Hautbild", opts:["trocken","fettig","sensibel","unrein","normal"]},
    {k:"ziel", label:"Stört am meisten", opts:["Trockenheit","Unreinheiten","Rötung"]},
    {k:"sonne", label:"Sonnenschutz", opts:["Täglich","Manchmal","Selten"]}
  ];
  const ready=q.every(x=>state.skin[x.k]);

    const recs=CARE.filter(c=>scoreCare(c).score>=70).slice(0,2);
    return `<h2>Hautplan</h2>
      <div class="sub">Hautbild ${state.skin.typ} · ${state.skin.ziel}</div>
      <div class="sub">${state.skin.sonne==="Täglich"?"LSF beibehalten":"LSF in den Morgen"}</div>
      ${recs.map(p=>`<button class="food" data-act="open" data-type="product" data-id="${p.id}"><div class="thumb">${p.emoji}</div><div class="grow"><b>${p.name}</b></div><div class="score ${scoreClass(scored(p).score)}">${scored(p).score}</div></button>`).join("")}
      <p class="sub">Nur ein Hinweis. Nichts zum Abhaken.</p>`;
  }
  return `<h2>Haut</h2>${q.map(item=>`<div class="q"><b>${item.label}</b><div class="opts">${item.opts.map(o=>`<button class="chip ${state.skin[item.k]===o?"on":""}" data-act="skin" data-k="${item.k}" data-v="${o}">${o}</button>`).join("")}</div></div>`).join("")}
    <div class="gap"></div><button class="pill primary" data-act="skin-done" ${ready?"":"disabled"}>Tipp anpassen</button>`;

function render(){ try{ ensureRoutine(); }catch(e){}
  const root=document.getElementById("app");
  let html = !state.onboarded ? (state.step==null ? renderWelcome() : renderOnboard()) : renderApp();
  if(!state.onboarded && state.step==null) html=renderWelcome();
  html += renderModal();
  if(ui.toast) html += `<div class="toast">${esc(ui.toast)}</div>`;
  // Scroll-Positionen merken, damit ein Neuaufbau (Tipp, Toast, Timer) nicht nach oben springt
  const keep=[...root.querySelectorAll(".scroll,.sheet-card")].map(n=>n.scrollTop);
  const view=ui.workout?"w":ui.plan?"p":ui.dash?"d:"+ui.dash:"t:"+state.tab;
  const same=(ui._view===view)&&!!state.onboarded;
  ui._view=view;
  root.innerHTML = html;
  if(same){ [...root.querySelectorAll(".scroll,.sheet-card")].forEach((n,i)=>{ if(keep[i]) n.scrollTop=keep[i]; }); }
}
function seedDemo(){
  state = fresh();
  state.onboarded=true; state.step=0;
  state.profile.name="Alex"; state.profile.adult=true; state.profile.goal="muscle";
  const t=todayIso();
  state.date=t;
  for(let i=6;i>=0;i--){
    const s=addDays(t,-i);
    const kg=+(76.8-i*0.12).toFixed(1);
    state.weights.push({date:s, kg});
    state.days[s]=blankDay();
    if(i>0){
      state.days[s].meals=[
        {uid:uid(), id:"skyr", portion:200, slot:"breakfast"},
        {uid:uid(), id:"hafer", portion:50, slot:"breakfast"},
        {uid:uid(), id:"huhn", portion:180, slot:"lunch"},
        {uid:uid(), id:"reis", portion:150, slot:"lunch"}
      ];
      state.days[s].water = i%2?8:5;
      state.days[s].checks={pflege:1, schlaf:i%2?1:0, sport:i%3===0?1:0};
      state.days[s].taken={crea:1, d3:i%2?1:0};
    }
  }
  ["Push","Pull","Beine","Push","Pull"].forEach((name,i)=>state.workouts.push({ id:uid(), date:addDays(t,-1-i*2), name:name, min:40, volume:2000+i*120, sets:9, exercises:[] }));
  state.profile.weight=lastWeight();
  save();
}

    save(); toast("Messung gespeichert");
  }
  else if(act==="wrange"){ ui.wrange=el.dataset.v; ui.wpick=null; }
  else if(act==="w-pick"){ ui.wpick=el.dataset.v; }
  else if(act==="plan-step"){
    const key="p-"+el.dataset.id+"-"+el.dataset.i;
    day().checks[key]=day().checks[key]?0:1;
    if(el.dataset.id==="schlaf") day().checks.schlaf = coachPlans().schlaf.steps.every((_,i)=>day().checks["p-schlaf-"+i])?1:0;
    if(el.dataset.id==="haut"||el.dataset.id==="haare"||el.dataset.id==="koerper"){
      const id=el.dataset.id;
      day().checks.pflege = coachPlans()[id].steps.every((_,i)=>day().checks["p-"+id+"-"+i])?1:day().checks.pflege;
    }
    save();
  }
  else if(act==="haut-reset"){ state.hautPlan=false; save(); }
  else if(act==="goal-weeks"){ state.profile.goalDate=addDays(todayIso(), 7*8); save(); toast("Ziel in 8 Wochen"); }
  else if(act==="affiliate") toast("Anzeige · Score bleibt gleich");
  else if(act==="export"){ openModal("export"); return; }
  else if(act==="reset"){ try{ localStorage.removeItem(KEY); }catch(e){} state=fresh(); ui.modal=null; toast("Gelöscht"); }
  render();
});
document.getElementById("app").addEventListener("input", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.act==="input"){ state.profile[el.dataset.k]=el.value; save(); }
  if(el.dataset.act==="query"){
    ui.query=el.value; ui.scanMax=30;
    const box=document.getElementById("scan-results");
    if(box) box.innerHTML=scanResults(); else render();
  }
  if(el.dataset.act==="ai-g"){ const k=+el.dataset.i, it=(ui.aiRes||[])[k]; if(it){ it.grams=Math.max(0,+el.value||0); const kc=document.getElementById("ai-k"+k), tt=document.getElementById("ai-tot"); if(kc) kc.textContent=Math.round(it.kcal*it.grams/100); if(tt) tt.textContent=ui.aiRes.reduce((t,x)=>t+Math.round(x.kcal*x.grams/100),0); } }
  if(el.dataset.act==="portion-in"){ ui.portion=+el.value||0; const it=allItems().find(p=>p.id===el.dataset.id), b=document.getElementById("fmacros"), t=document.getElementById("ftable"), v=document.getElementById("amt-val"); if(it){ if(b) b.innerHTML=fMacros(it,ui.portion); if(t) t.innerHTML=fTable(it,ui.portion); } if(v) v.textContent=ui.portion||0; }
  if(el.dataset.act==="set-kg") ui.workout.exercises[+el.dataset.e].sets[+el.dataset.s].kg=+el.value||0;
  if(el.dataset.act==="set-reps") ui.workout.exercises[+el.dataset.e].sets[+el.dataset.s].reps=+el.value||0;
  if(el.dataset.act==="plan-name") ui.plan.name=el.value;
  if(el.dataset.act==="day-name") ui.plan.days[+el.dataset.d].name=el.value;
  if(el.dataset.act==="plan-kg") ui.plan.exercises[+el.dataset.e].sets[+el.dataset.s].kg=+el.value||0;
  if(el.dataset.act==="plan-reps") ui.plan.exercises[+el.dataset.e].sets[+el.dataset.s].reps=+el.value||0;
  if(el.dataset.act==="ex-query"){
    ui.exQuery=el.value; render();
    const n=document.querySelector('input[data-act="ex-query"]');
    if(n){ n.focus(); n.setSelectionRange(ui.exQuery.length, ui.exQuery.length); }
  }
});
function startTick(){
  stopTick();
  ui.tick=setInterval(()=>{
    const was=ui.rest>0; if(ui.rest>0) ui.rest--;
    if(!ui.workout) return;
    const c=document.querySelector(".clock"); if(c&&ui.workout) c.textContent=clock(ui.workout.t0);
    if(was&&ui.rest===0){ render(); return; }
    const pb=document.querySelector(".t-rest"); if(pb) pb.textContent=(ui.rest||0)+"s";
    const rb=document.querySelector(".rest span"); if(rb) rb.textContent="Pause "+ui.rest+"s";
  }, 1000);
}
function stopTick(){ if(ui.tick){ clearInterval(ui.tick); ui.tick=null; } }
render();

if("serviceWorker" in navigator && location.protocol.startsWith("http")) window.addEventListener("load",()=>{ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} });

let swipeY=null;
document.getElementById("app").addEventListener("touchstart",e=>{ swipeY=e.target.closest(".amt.open")?e.touches[0].clientY:null; },{passive:true});
document.getElementById("app").addEventListener("touchend",e=>{
  if(swipeY==null) return; const dy=e.changedTouches[0].clientY-swipeY; swipeY=null;
  if(dy>50){ const a=document.querySelector(".amt"); if(a){ a.classList.remove("open"); ui.amtOpen=false; const i=document.getElementById("portion"); if(i) i.blur(); } }
},{passive:true});
loadFoodDb();
</script>
